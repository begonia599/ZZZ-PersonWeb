services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173" 
    volumes:
      - ./frontend:/app 
      - /app/node_modules 
    environment:
      # 网站基本信息
      - VITE_SITE_NAME=${VITE_SITE_NAME}
      - VITE_SITE_AUTHOR=${VITE_SITE_AUTHOR}
      - VITE_SITE_SLOGAN=${VITE_SITE_SLOGAN}
      # 备案信息
      - VITE_ICP_BEIAN=${VITE_ICP_BEIAN}
      - VITE_GONGAN_BEIAN=${VITE_GONGAN_BEIAN}
      - VITE_GONGAN_RECORD_CODE=${VITE_GONGAN_RECORD_CODE}
      # 关于我 - 个人信息
      - VITE_AVATAR_URL=${VITE_AVATAR_URL}
      - VITE_USER_NAME=${VITE_USER_NAME}
      - VITE_USER_BIO=${VITE_USER_BIO}
      - VITE_USER_DESCRIPTION=${VITE_USER_DESCRIPTION}
      - VITE_USER_TAGS=${VITE_USER_TAGS}
      # 社交平台链接
      - VITE_SOCIAL_GITHUB=${VITE_SOCIAL_GITHUB}
      - VITE_SOCIAL_BILIBILI=${VITE_SOCIAL_BILIBILI}
      - VITE_SOCIAL_WEIBO=${VITE_SOCIAL_WEIBO}
      - VITE_SOCIAL_TWITTER=${VITE_SOCIAL_TWITTER}
      - VITE_SOCIAL_ZHIHU=${VITE_SOCIAL_ZHIHU}
      - VITE_SOCIAL_JUEJIN=${VITE_SOCIAL_JUEJIN}
      - VITE_SOCIAL_CSDN=${VITE_SOCIAL_CSDN}
      - VITE_SOCIAL_LINKEDIN=${VITE_SOCIAL_LINKEDIN}
      - VITE_SOCIAL_EMAIL=${VITE_SOCIAL_EMAIL}
      - VITE_SOCIAL_BLOG=${VITE_SOCIAL_BLOG}
      - VITE_SOCIAL_QQ=${VITE_SOCIAL_QQ}
      - VITE_SOCIAL_WECHAT=${VITE_SOCIAL_WECHAT}
      # Live2D 模型配置
      - VITE_LIVE2D_MODEL_PATH=${VITE_LIVE2D_MODEL_PATH} 
      - VITE_LIVE2D_MODEL_WIDTH=${VITE_LIVE2D_MODEL_WIDTH}
      - VITE_LIVE2D_MODEL_HEIGHT=${VITE_LIVE2D_MODEL_HEIGHT}
      - VITE_LIVE2D_MODEL_MOBILE_WIDTH=${VITE_LIVE2D_MODEL_MOBILE_WIDTH}
      - VITE_LIVE2D_MODEL_MOBILE_HEIGHT=${VITE_LIVE2D_MODEL_MOBILE_HEIGHT}
      # Docker 环境标识
      - DOCKER_ENV=true
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - backend 

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/instance:/app/instance 
    environment:
      - PYTHONUNBUFFERED=1 
    command: >
      gunicorn -w 4 -b 0.0.0.0:5000 --log-file - --error-logfile - "run:app"